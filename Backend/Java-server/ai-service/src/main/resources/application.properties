server.port=8084
spring.application.name=ai-service

# --- Spring AI / Google Gemini (Gemini Developer API - the FREE tier) ---
# Get a free key (no credit card needed) at: https://aistudio.google.com/apikey
# Set it as an environment variable before starting this service:
#   Windows (PowerShell):  $env:GEMINI_API_KEY="AIza..."
#   Then run from the SAME terminal: mvn spring-boot:run
# Never hardcode a real key directly in this file, especially if this repo
# is pushed to GitHub.
#
# IMPORTANT: do NOT add spring.ai.google.genai.project-id or
# spring.ai.google.genai.location anywhere in this file. Setting either one
# switches Spring AI into PAID Vertex AI mode, and your free API key will
# then be rejected with a confusing 400 auth error that looks like a quota
# problem but isn't. API key alone = free Gemini Developer API. Keep it that way.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-flash-latest
spring.ai.google.genai.chat.temperature=0.4

# --- Eureka Discovery Client (same pattern as the other three services) ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# --- Where to reach appointment-service for real feedback data ---
services.appointment-service.base-url=http://localhost:8083

logging.level.com.connectdoc.ai=INFO
