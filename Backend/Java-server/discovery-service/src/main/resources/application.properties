server.port=8761
spring.application.name=discovery-service

# This service IS the Eureka registry, so it doesn't need to register
# itself as a client or fetch a registry from anywhere else.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.instance.hostname=localhost

# Quiet down the console a bit - self-preservation mode logging is noisy
# and irrelevant for a single-node local dev setup.
eureka.server.enable-self-preservation=false
