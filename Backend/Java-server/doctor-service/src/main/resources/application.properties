spring.application.name=doctor-service
server.port=8082

# MySQL Database configuration (shared schema, this service only owns DOCTORS + AVAILABILITY + HOSPITALS tables)
spring.datasource.url=jdbc:mysql://localhost:3306/p25_ctyd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=system
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Other microservices this service talks to
user.service.url=http://localhost:8081
appointment.service.url=http://localhost:8083

# Must match user-service's jwt.secret exactly - it issues the tokens, this
# service only verifies their signature.
jwt.secret=ConnectToYourDoctorSuperSecretKeyForJWTSigning2026ChangeMe

# --- Eureka Discovery Client ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
